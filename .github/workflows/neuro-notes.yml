# Neuro Notes をビルドして GitHub Pages に公開する
# 事前設定: リポジトリの Settings → Pages → Source を「GitHub Actions」にする
name: neuro-notes

on:
  push:
    paths:
      - "neuro-notes/**"
      - ".github/workflows/neuro-notes.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: neuro-notes-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuro-notes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 各ノートの更新日を git 履歴から取るため
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: neuro-notes/dist

  deploy:
    # 既定ブランチへの push（または手動実行）のときだけ公開する
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
